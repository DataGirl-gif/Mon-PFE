{% extends 'core/base.html' %}
{% block title %}Ajouter un Examen - Ibn Heitham{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-3 p-4">
            <h4 class="fw-bold mb-4 text-primary">
                <i class="bi bi-plus-circle"></i> Ajouter un nouvel examen
            </h4>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="small fw-bold text-muted">Désignation</label>
                    <input type="text" name="nom" class="form-control" placeholder="Ex: Hémogramme complet" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="small fw-bold text-muted">Prix (MRU)</label>
                        <input type="number" step="0.01" name="prix" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="small fw-bold text-muted">Unité</label>
                        <input type="text" name="unite" class="form-control" placeholder="Ex: g/dL">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="small fw-bold text-muted">Description</label>
                    <textarea name="valeurs_normales" class="form-control" rows="5" placeholder="Valeurs de référence ou détails..."></textarea>
                </div>
                
                <div class="d-flex gap-2">
                    
                    <a href="{% url 'liste_examens' %}" class="btn btn-outline-secondary flex-grow-1 fw-bold">Annuler</a>

                    {% if perms.core.add_VisiteAnalyse %}
                        <button type="submit" class="btn btn-primary flex-grow-1 fw-bold">Enregistrer l'examen</button>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
